name: Yasith Jayawardana, PhD
about: >-
  I model human behavior from biological signals and user interactions, and simulate it on HPC.
  I hold a PhD (CS) from Old Dominion University (USA) on modeling behavior and neurodivergence from eye tracking, and a BS (CSE) from the University of Moratuwa (Sri Lanka) on designing distributed systems.
  I've built algorithms to estimate attention and cognitive load from eye movements, detect autistic traits from EEG, compress waveforms into ODEs, and infer distribution shift with combinatorics.
  I've built tools for synthetic user research (Marketrix), biosignal stream processing (StreamingHub), and interactive scientific computing (Apache Airavata, Cybershuttle).
  When time permits, I make music (YT @yasithdev).
