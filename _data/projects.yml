      technologies: [Go, C++, PAM, OAuth2 / OIDC, CILogon]
      links:
        - key: GitHub
          link: https://github.com/apache/airavata-custos
        - key: Paper
          link: https://doi.org/10.1145/3785462.3815896

    - title: Slurm REST
      icon: /assets/img/projects/slurm.png
