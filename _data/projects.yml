- category: Human Sensing & Machine Learning
  projects:
    - title: StreamingHub
      icon: /assets/img/projects/streaminghub.png
      term: 2019-2024
      description: |-
        A framework for real-time experiments with multimodal biosignals.
        Metadata schemas, Python APIs, a dataset curation app, and DataMux for streaming.
        The subject of my PhD dissertation.
      technologies: [Python, WebSockets, Flask, LabStreamingLayer, JSON Schema]
      links:
        - key: GitHub
          link: https://github.com/nirdslab/streaminghub
        - key: Paper
          link: https://doi.org/10.1145/3529372.3530936

    - title: Robust ML for Clinical Imaging
      icon: /assets/img/harvard.png
      term: 2022-2024
      description: |-
        Culture-free detection of antimicrobial-resistant bacteria in single-cell microscopy images with capsule networks.
        Flag near-out-of-distribution inputs with permutation tests, so clinics can trust the models.
      technologies: [Python, PyTorch, TensorFlow, SciPy]
      links:
        - key: Paper
          link: https://arxiv.org/abs/2403.14058
        - key: CapsNet
          link: https://github.com/yasithdev/capsnet

    - title: Real-Time Attention & Mental Effort
      icon: /assets/img/projects/attention.svg
      term: 2021-2025
      description: |-
        Estimate ambient vs. focal attention and mental effort from eye movements and pupil size.
      technologies: [Python, Eye Tracking, Pupillometry]
      links:
        - key: Paper
          link: https://doi.org/10.3390/jemr18060070
        - key: ETRA '25
          link: https://doi.org/10.1145/3715669.3723111

    - title: Multimode Fiber Dynamics
      icon: /assets/img/projects/fiber.svg
      term: 2022-2023
      description: |-
        Model light in multimode fibers with Neural ODEs.
      technologies: [Python, PyTorch, Neural ODEs]
      links:
        - key: Paper
          link: https://doi.org/10.1109/ipc57732.2023.10360586

    - title: MGaze
      icon: /assets/img/projects/mgaze.svg
