- category: Research Computing & Systems
  projects:
    - title: Cybershuttle
      icon: /assets/img/projects/csbridge.png
      term: 2024-Present
      description: |-
        Jupyter and VS Code on HPC compute nodes, from a browser or editor. No inbound ports.
        Built CS Bridge, CS Jupyter, and Linkspan.
      technologies: [TypeScript, Go, Python, Slurm, CILogon, VS Code API, JupyterLab]
      links:
        - key: GitHub
          link: https://github.com/cyber-shuttle
        - key: CS Bridge
          link: https://github.com/cyber-shuttle/cs-bridge
        - key: CS Jupyter
          link: https://github.com/cyber-shuttle/cs-jupyter
        - key: Linkspan
          link: https://github.com/cyber-shuttle/linkspan
        - key: Paper
          link: https://doi.org/10.1145/3626203.3670623

    - title: Apache Airavata
      icon: /assets/img/projects/airavata.png
      term: 2024-Present
      description: |-
        Science gateway middleware to run experiments across HPC and cloud. Control plane for Cybershuttle.
        290+ commits: Keycloak auth, scoped APIs, a Python SDK, Slurm fixes, and dev tooling.
      technologies: [Java, Python, Keycloak, Slurm]
      links:
        - key: GitHub
          link: https://github.com/apache/airavata

    - title: Custos
      icon: /assets/img/projects/custos.svg
