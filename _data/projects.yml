- category: Research Computing
  projects:
    - title: Cybershuttle
      term: 2024-Present
      description: |-
        Run Jupyter and VS Code sessions on HPC compute nodes, reachable from a browser or editor, with no inbound ports on the cluster.
        Built the control plane (cs-plane), the in-job agent (Linkspan), the CS Bridge VS Code extension, and CS Jupyter.
      technologies: [Go, TypeScript, Python, Slurm, CILogon, VS Code API, JupyterLab]
      links:
        - key: GitHub
          link: https://github.com/cyber-shuttle
        - key: CS Bridge
          link: https://github.com/cyber-shuttle/cs-bridge
        - key: Linkspan
          link: https://github.com/cyber-shuttle/linkspan
        - key: Paper
          link: https://doi.org/10.1145/3626203.3670623

    - title: Apache Airavata
      term: 2024-Present
      description: |-
        Science gateway middleware to run experiments across HPC and cloud from one framework.
        290+ commits: token-based auth with Keycloak, access-scoped APIs, a generated Python SDK, Slurm execution fixes, and dev-stack tooling.
      technologies: [Java, Python, Keycloak, Slurm]
      links:
        - key: GitHub
          link: https://github.com/apache/airavata

    - title: Federated HPC Accounts (Airavata Custos)
      term: 2026
      description: |-
        Provision HPC accounts from federated identities, using CILogon, COmanage, and a PAM module for the OAuth2 device flow.
      technologies: [Go, C++, PAM, OAuth2 / OIDC, CILogon]
      links:
        - key: GitHub
          link: https://github.com/apache/airavata-custos
        - key: Paper
          link: https://doi.org/10.1145/3785462.3815896

    - title: slurmrest
      term: 2026
      description: |-
        A Dockerized Slurm 24.05 cluster with the REST daemon exposed, plus a Go CLI (nexusctl) to administer accounts, users, and limits.
      technologies: [Go, Slurm, Docker Compose]
      links:
        - key: GitHub
          link: https://github.com/yasithdev/slurmrest

    - title: CyberComp
      term: 2024
      description: |-
        Define computational experiments by coupling models with execution engines, compose them into larger experiments, and compare their observables.
      technologies: [Python]
      links:
        - key: GitHub
          link: https://github.com/yasithdev/cybercomp

- category: Human Sensing & Machine Learning
  projects:
    - title: StreamingHub
      term: 2019-2024
      description: |-
        A framework to build real-time experiments with multimodal biosignals.
        Provides metadata schemas (DFDS), Python APIs to read them, a web app to curate datasets, and DataMux to stream from devices, recordings, and simulations alike.
        Used for eye movement and EEG analysis workflows; the subject of my PhD dissertation.
      technologies: [Python, WebSockets, Flask, LabStreamingLayer, JSON Schema]
      links:
        - key: GitHub
          link: https://github.com/nirdslab/streaminghub
        - key: Paper
          link: https://doi.org/10.1145/3529372.3530936

    - title: Robust ML for Clinical Imaging
      term: 2022-2024
      description: |-
        Culture-free, early detection of antimicrobial-resistant bacteria from single-cell quantitative phase microscopy (QPM) images, using interpretable capsule networks.
        Detect near-out-of-distribution inputs with permutation tests over groups of samples, so models can be trusted in clinical settings.
      technologies: [Python, PyTorch, TensorFlow, SciPy]
      links:
        - key: Paper
          link: https://arxiv.org/abs/2403.14058
        - key: CapsNet
          link: https://github.com/yasithdev/capsnet

    - title: Real-Time Attention & Mental Effort
      term: 2021-2025
      description: |-
        Algorithms to estimate visual attention (ambient vs. focal) and mental effort from eye movements and pupil size, in real time.
      technologies: [Python, Eye Tracking, Pupillometry]
      links:
        - key: Paper
          link: https://doi.org/10.3390/jemr18060070
        - key: ETRA '25
          link: https://doi.org/10.1145/3715669.3723111

    - title: Multimode Fiber Dynamics
      term: 2022-2023
      description: |-
        Approximate wave propagation in multimode fibers with differentiable models and Neural ODEs.
      technologies: [Python, PyTorch, Neural ODEs]
      links:
        - key: Paper
          link: https://doi.org/10.1109/ipc57732.2023.10360586

    - title: MGaze
      term: 2020
      description: |-
        Collaborative project: webcam-based, multi-user eye tracking in the browser: face detection, landmarks, iris detection, and gaze estimation, without extra hardware.
      technologies: [MediaPipe, TF.js, Node]
      links:
        - key: GitHub
          link: https://github.com/nirdslab/multigazeinterations

    - title: ASD Detection
      term: 2019
      description: |-
        Predict autism spectrum disorder from EEG and thermography: wavelet features from EEG, then neural models trained on them.
        Won Best Student Paper at IEEE IRI 2019.
      technologies: [Python, TensorFlow, PyWavelets, Pandas]
      links:
        - key: GitHub
          link: https://github.com/nirdslab/asd-detection
        - key: Paper
          link: https://doi.org/10.1109/iri.2019.00035

