      description: |-
        Multi-user eye tracking from webcams, in the browser. A collaborative project.
      technologies: [MediaPipe, TF.js, Node]
      links:
        - key: GitHub
          link: https://github.com/nirdslab/multigazeinterations

    - title: ASD Detection
      icon: /assets/img/projects/asd.svg
