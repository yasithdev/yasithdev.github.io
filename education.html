---
layout: default
title: Education
---
<ul class="timeline">
  {% for e in site.data.education %}
  <li>
    <img class="logo" src="{{ e.logo | relative_url }}" alt="">
    <div>
      <div class="head"><span class="item-title">{{ e.name }}</span><span class="term">{{ e.term }}</span></div>
      <div class="role meta">{{ e.degree }}, {{ e.major }}</div>
      {{ e.description | markdownify }}
      {% for x in e.extra %}<p class="extra meta"><strong>{{ x.key }}:</strong> {{ x.value }}</p>{% endfor %}
    </div>
  </li>
  {% endfor %}
</ul>
