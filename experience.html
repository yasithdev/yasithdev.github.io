---
layout: default
title: Experience
---
{% for experience in site.data.experience %}
<table>
  <tbody>
    <tr class="header">
      <td width="40px"><img class="logo" src="{{experience.logo | relative_url}}"></td>
      <td>
        <strong>{{ experience.affiliation }}</strong>
        <span class="term">({{ experience.term }})</span>
        <br />
        <small><strong>{{ experience.designation }}</strong></small>
      </td>
    </tr>
    <tr>
      <td colspan="2">
        {{ experience.description | markdownify }}
      </td>
    </tr>
  </tbody>
</table>
{% endfor %}
