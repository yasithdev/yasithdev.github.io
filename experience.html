---
layout: default
title: Experience
---
<ul class="timeline">
  {% for e in site.data.experience %}
  <li>
    <img class="logo" src="{{ e.logo | relative_url }}" alt="">
    <div>
      <div class="head"><span class="item-title">{{ e.affiliation }}</span><span class="term">{{ e.term }}</span></div>
      <div class="role meta">{{ e.designation }}</div>
      {{ e.description | markdownify }}
    </div>
  </li>
  {% endfor %}
</ul>
