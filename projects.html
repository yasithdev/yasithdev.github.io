---
layout: default
title: Projects
---
{% for project in site.data.projects %}
<table>
  <tbody>
    <tr class="header">
      <td>
        <strong>{{ project.title }}</strong>
        <span class="term">({{ project.term }})</span>
        <br />
        {% for t in project.technologies %}
        <span class="tag">{{ t }}</span>
        {% endfor %}
      </td>
    </tr>
    <tr>
      <td>
        {{ project.description | markdownify }}
      </td>
    </tr>
  </tbody>
</table>
{% endfor %}
